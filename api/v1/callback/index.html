<!DOCTYPE html>
<html lang="en">
<head>
	<title>Select Spreadsheet</title>
	<!-- Load the Google API loader -->
	<script src="https://apis.google.com/js/api.js"></script>
	<script>
		const developerKey = '{{.APIKey}}';
		const accessToken = '{{.AccessToken}}';
		const userAccessKey = '{{.UserAccessKey}}';
		const state = '{{.State}}';

		function loadPicker() {
			gapi.load('picker', { 'callback': onPickerApiLoad });
		}

		function onPickerApiLoad() {
			const view = new google.picker.DocsView(google.picker.ViewId.SPREADSHEETS)
				.setMimeTypes('application/vnd.google-apps.spreadsheet');

			const picker = new google.picker.PickerBuilder()
				.addView(view)
				.setOAuthToken(accessToken)
				.setDeveloperKey(developerKey)
				.setCallback(pickerCallback)
				.build();

			picker.setVisible(true);
		}

		function pickerCallback(data) {
			if (data.action == google.picker.Action.PICKED) {
				const documentId = data.docs[0].id;

				fetch('/api/v1/link', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({
						sheet_id: documentId,
						user_access_key: userAccessKey,
						state: state,
					})
				})
					.then(response => {
						if (response.ok) {
							document.getElementById('status').innerText =
								"Success! Set your mobile app to use Access Key: " + userAccessKey;
						}
					});
			}
		}
	</script>
</head>
<body onload="loadPicker()">
<div id="status">Waiting for selection...</div>
</body>
</html>
